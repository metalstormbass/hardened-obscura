name: Pipeline (Chainguard hardened)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@ec419da8013e66e059571719dbfa6d1483438668 # v7.0.1
        # originally - uses: actions/checkout@v7

      - name: Spell check
        uses: chainguard-actions/crate-ci-typos@e069b15869a17c6f5d9e2d951c06fcccc248b1a5 # v1.49.0
        # originally - uses: crate-ci/typos@v1.49.0
        with:
          config: .typos.toml

      - name: Verify required files exist
        uses: chainguard-actions/andstor-file-existence-action@4333b69cff4f5e158117ec7caa497fc0d8c6234f # v3.1.0
        # originally - uses: andstor/file-existence-action@v3.1.0
        with:
          files: "config/release.yaml, templates/report.md.tpl, docs/notes.md"
          fail: true

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: chainguard-actions/actions-checkout@ec419da8013e66e059571719dbfa6d1483438668 # v7.0.1
        # originally - uses: actions/checkout@v7

      - name: Read release version with yq
        id: version
        uses: chainguard-actions/mikefarah-yq@2b70269397dc80593071c921ebdf559afe5aea7c # v4.53.3
        # originally - uses: mikefarah/yq@v4.53.3
        with:
          cmd: yq '.release.version' config/release.yaml

      - name: Render build report
        uses: chainguard-actions/chuhlomin-render-template@b26f3d75bfa3878230f2a7aa101b39000a7331c1 # v1.12
        # originally - uses: chuhlomin/render-template@v1.12
        with:
          template: templates/report.md.tpl
          result_path: build-report.md
          vars: |
            repo: ${{ github.repository }}
            sha: ${{ github.sha }}
            version: ${{ steps.version.outputs.result }}

      - name: Show build report
        run: cat build-report.md

  transcode:
    name: Transcode sample media
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - name: Free disk space
        uses: chainguard-actions/jlumbroso-free-disk-space@52482bc28020afba6a8cbc838b7ddbd9ab5dedc3 # v1.3.1
        # originally - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Set up FFmpeg
        uses: chainguard-actions/AnimMouse-setup-ffmpeg@34ee4b393c648bc7ef4251a66605d68655afad39 # v1.2.5
        # originally - uses: AnimMouse/setup-ffmpeg@v1.2.5
        with:
          # "release" resolves to FFmpeg 9.0, which BtbN/FFmpeg-Builds does
          # not publish yet; pin to a version with published Linux builds
          version: "8.1"

      - name: Download sample video
        id: download
        uses: chainguard-actions/carlosperate-download-file-action@c1c5aa30bf5d07d4944d58c7700591fa69849c07 # v2.0.2
        # originally - uses: carlosperate/download-file-action@v2.0.2
        # note: hardened v2.0.3 is broken — chainguard-phonehome.js uses require()
        # but upstream v2.0.3 switched package.json to "type": "module"
        with:
          file-url: https://raw.githubusercontent.com/mathiasbynens/small/master/Mpeg4.mp4
          file-name: sample.mp4
          location: downloads

      - name: Probe and transcode
        env:
          SAMPLE_PATH: ${{ steps.download.outputs.file-path }}
        run: |
          mkdir -p out
          ffprobe -hide_banner "$SAMPLE_PATH"
          ffmpeg -hide_banner -f lavfi -i testsrc=duration=2:size=320x240:rate=24 out/testcard.mp4
          ffprobe -hide_banner out/testcard.mp4
