name: Pipeline (Chainguard hardened)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@v7.0.1
        # originally - uses: actions/checkout@v7

      - name: Spell check
        uses: chainguard-actions/crate-ci-typos@v1.49.0
        # originally - uses: crate-ci/typos@v1.49.0
        with:
          config: .typos.toml

      - name: Verify required files exist
        uses: chainguard-actions/andstor-file-existence-action@v3.1.0
        # originally - uses: andstor/file-existence-action@v3.1.0
        with:
          files: "config/release.yaml, templates/report.md.tpl, docs/notes.md"
          fail: true

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: chainguard-actions/actions-checkout@v7.0.1
        # originally - uses: actions/checkout@v7

      - name: Install Crane
        uses: chainguard-actions/imjasonh-setup-crane@v0.5
        # originally - uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5

      - name: Show crane version
        run: crane version

      - name: Read release version with yq
        id: version
        uses: chainguard-actions/mikefarah-yq@v4.53.3
        # originally - uses: mikefarah/yq@v4.53.3
        with:
          cmd: yq '.release.version' config/release.yaml

      - name: Render build report
        uses: chainguard-actions/chuhlomin-render-template@v1.12
        # originally - uses: chuhlomin/render-template@v1.12
        with:
          template: templates/report.md.tpl
          result_path: build-report.md
          vars: |
            repo: ${{ github.repository }}
            sha: ${{ github.sha }}
            version: ${{ steps.version.outputs.result }}

      - name: Show build report
        run: cat build-report.md

  transcode:
    name: Transcode sample media
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - name: Free disk space
        uses: chainguard-actions/jlumbroso-free-disk-space@v1.3.1
        # originally - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Set up FFmpeg
        uses: chainguard-actions/AnimMouse-setup-ffmpeg@v1.2.5
        # originally - uses: AnimMouse/setup-ffmpeg@v1.2.5
        with:
          version: "8.1"

      - name: Generate and probe test video
        run: |
          mkdir -p out
          ffmpeg -hide_banner -f lavfi -i testsrc=duration=2:size=320x240:rate=24 out/testcard.mp4
          ffprobe -hide_banner out/testcard.mp4
