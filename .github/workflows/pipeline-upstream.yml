name: Pipeline (upstream actions)

# Identical pipeline to pipeline-hardened.yml, but using the original
# upstream community actions referenced by mutable tags — the "before"
# picture of a typical workflow prior to migrating to Chainguard
# hardened actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Spell check
        uses: chainguard-actions/crate-ci-typos@a2864935c77930cb477f5099a28a4c385d07187d # v1.49.0
        with:
          config: .typos.toml

      - name: Verify required files exist
        uses: andstor/file-existence-action@v3
        with:
          files: "config/release.yaml, templates/report.md.tpl, docs/notes.md"
          fail: true

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v5

      # Upstream: https://github.com/imjasonh/setup-crane
      - name: Install Crane
        uses: chainguard-actions/imjasonh-setup-crane@418bcec4843c23628bb9eaba6fd6ccc49054ba95 # v0.5

      - name: Show crane version
        run: crane version

      - name: Read release version with yq
        id: version
        uses: chainguard-actions/mikefarah-yq@2b70269397dc80593071c921ebdf559afe5aea7c # v4.53.3
        with:
          cmd: yq '.release.version' config/release.yaml

      - name: Render build report
        uses: chainguard-actions/chuhlomin-render-template@486831ee11794c945fe6b089e8a937dfd87a1156 # v1.12
        with:
          template: templates/report.md.tpl
          result_path: build-report.md
          vars: |
            repo: ${{ github.repository }}
            sha: ${{ github.sha }}
            version: ${{ steps.version.outputs.result }}

      - name: Show build report
        run: cat build-report.md

  transcode:
    name: Transcode sample media
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - name: Free disk space
        uses: chainguard-actions/jlumbroso-free-disk-space@bb4be8ca2c3c54c6fedafa24b4773dc11e5f1d59 # v1.3.1
        with:
          android: false
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Set up FFmpeg
        uses: chainguard-actions/AnimMouse-setup-ffmpeg@71ee6a14bcfe45566950cdb6e5f8ebfead431acd # v1
        with:
          version: "8.1"

      - name: Generate and probe test video
        run: |
          mkdir -p out
          ffmpeg -hide_banner -f lavfi -i testsrc=duration=2:size=320x240:rate=24 out/testcard.mp4
          ffprobe -hide_banner out/testcard.mp4
